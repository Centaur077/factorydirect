services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: factorydirect
      POSTGRES_USER: factorydirect
      POSTGRES_PASSWORD: factorydirect
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factorydirect -d factorydirect"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgres://factorydirect:factorydirect@db:5432/factorydirect
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-docker-only-change-me}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.test}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
